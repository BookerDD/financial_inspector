x-superset-common: &superset-common
  image: financial_inspector/superset:4.1.2
  build:
    context: .
    dockerfile: dockerfile.superset
  environment:
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
  volumes:
    - superset-home:/app/superset_home
    - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro

services:
  superset-init:
    <<: *superset-common
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "superset db upgrade &&
      (superset fab create-admin --username ${SUPERSET_ADMIN_USERNAME} --firstname Admin --lastname Admin --email admin@example.com --password ${SUPERSET_ADMIN_PASSWORD} || true) &&
      superset init"

  superset:
    <<: *superset-common
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    restart: always
    command: /usr/bin/run-server.sh

volumes:
  superset-home:
